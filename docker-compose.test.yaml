services:
  app:
    stop_grace_period: 35s
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tf2dle
    depends_on:
      - db
    networks:
      - tf2dle_network

  proxy:
    image: nginx:stable-alpine
    ports:
      - 127.0.0.1:3000:80
    volumes:
      - ./tests/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - tf2dle_network

  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tf2dle
    ports:
      - 5432:5432
    volumes:
      - tf2dle-test-db:/var/lib/postgresql/data
    networks:
      - tf2dle_network

volumes:
  tf2dle-test-db:

networks:
  tf2dle_network:
    name: tf2dle_network
    driver: bridge
